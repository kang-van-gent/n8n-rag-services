<!DOCTYPE html>
<html>

<head>
    <title>Omise Token Test</title>
    <script src="https://cdn.omise.co/omise.js"></script>
</head>

<body>
    <h2>Test Omise Token Creation</h2>
    <button onclick="createToken()">Create Test Token</button>
    <div id="result"></div>

    <script>
        Omise.setPublicKey('pkey_test_5nw5dlqajzq9gdwvuba');

        function createToken() {
            const cardData = {
                number: '4242424242424242',
                name: 'Test User',
                expiration_month: 12,
                expiration_year: 2025,
                security_code: '123'
            };

            Omise.createToken('card', cardData, function (statusCode, response) {
                console.log('Token creation response:', statusCode, response);
                document.getElementById('result').innerHTML =
                    '<pre>' + JSON.stringify(response, null, 2) + '</pre>';

                if (response.object === 'token') {
                    testCharge(response.id);
                }
            });
        }

        function testCharge(tokenId) {
            fetch('http://localhost:3001/api/charges', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    amount: 100,
                    currency: 'thb',
                    card: tokenId,
                    description: 'Test charge'
                })
            })
                .then(res => res.json())
                .then(data => {
                    console.log('Charge response:', data);
                    document.getElementById('result').innerHTML +=
                        '<h3>Charge Result:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                });
        }
    </script>
</body>

</html>
